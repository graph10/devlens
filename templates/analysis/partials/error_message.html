<div class="bg-severity-error/10 border border-severity-error/20 rounded-xl p-4 flex items-start gap-3" x-data="{ show: true }" x-show="show" x-transition>

    <p class="text-sm text-severity-error">{{ message }}</p>
    <button @click="show = false" class="ml-auto text-severity-error/50 hover:text-severity-error">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
</div>
