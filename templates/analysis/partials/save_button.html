{% load i18n %}
<button hx-post="{% url 'save-report' public_id %}"
        hx-target="#save-button-container"
        hx-swap="innerHTML"
        class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-lg border transition-all
               {% if is_saved %}
               bg-accent/10 border-accent/30 text-accent
               {% else %}
               bg-background-elevated border-border text-foreground-muted hover:text-foreground hover:border-border-hover
               {% endif %}">
    <svg class="w-3.5 h-3.5" fill="{% if is_saved %}currentColor{% else %}none{% endif %}" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
    </svg>
    {% if is_saved %}{% translate "Saved" %}{% else %}{% translate "Save" %}{% endif %}
</button>
