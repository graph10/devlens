{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="max-w-lg mx-auto px-4 sm:px-6 lg:px-8 py-16 text-center">
    <div class="w-16 h-16 rounded-2xl bg-emerald-500/10 flex items-center justify-center mx-auto mb-6">
        <svg class="w-8 h-8 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    </div>

    <h1 class="text-2xl font-bold text-foreground mb-2">{% translate "Payment Confirmed!" %}</h1>
    <p class="text-sm text-foreground-muted mb-8">
        {% translate "Your subscription is now active. Enjoy unlimited analyses and all Pro features." %}
    </p>

    <div class="flex items-center justify-center gap-4">
        <a href="{% url 'dashboard' %}" class="inline-flex items-center gap-2 px-6 py-2.5 bg-accent text-white font-semibold rounded-xl hover:bg-accent-hover shadow-glow transition-all">
            {% translate "Go to Dashboard" %}
        </a>
    </div>
</div>
{% endblock %}
