{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="max-w-lg mx-auto px-4 sm:px-6 lg:px-8 py-16 text-center">
    <div class="w-16 h-16 rounded-2xl bg-severity-error/10 flex items-center justify-center mx-auto mb-6">
        <svg class="w-8 h-8 text-severity-error" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    </div>

    <h1 class="text-2xl font-bold text-foreground mb-2">{% translate "Payment Failed" %}</h1>
    <p class="text-sm text-foreground-muted mb-8">
        {% translate "The payment could not be completed. Please try again." %}
    </p>

    <a href="{% url 'plans' %}" class="inline-flex items-center gap-2 px-6 py-2.5 bg-accent text-white font-semibold rounded-xl hover:bg-accent-hover shadow-glow transition-all">
        {% translate "Back to Pricing" %}
    </a>
</div>
{% endblock %}
