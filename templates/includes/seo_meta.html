{% load i18n %}
<meta name="description" content="{{ meta_description|default:_('DevLens — Paste any error, log, or technical output. Get a structured engineering report with root cause analysis and recommended fixes.') }}">
<meta name="keywords" content="developer tools, error analysis, debugging, python, docker, sql, git, AI diagnostics">
<meta name="author" content="DevLens">
<meta name="robots" content="index, follow">

<!-- OpenGraph -->
<meta property="og:type" content="{{ og_type|default:'website' }}">
<meta property="og:title" content="{{ meta_title|default:'DevLens' }}">
<meta property="og:description" content="{{ meta_description|default:_('Paste any error, log, or technical output. Get a structured engineering report.') }}">
<meta property="og:site_name" content="DevLens">
<meta property="og:locale" content="{{ LANGUAGE_CODE }}">
{% if og_published_time %}
<meta property="article:published_time" content="{{ og_published_time|date:'c' }}">
{% endif %}

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ meta_title|default:'DevLens' }}">
<meta name="twitter:description" content="{{ meta_description|default:_('Paste any error, log, or technical output. Get a structured engineering report.') }}">

<!-- Canonical -->
<link rel="canonical" href="{{ request.build_absolute_uri }}">

<!-- Alternate Languages -->
{% for lang_code, lang_name in LANGUAGES %}
<link rel="alternate" hreflang="{{ lang_code }}" href="{{ request.build_absolute_uri }}">
{% endfor %}

<!-- Schema.org -->
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "{% if og_type == 'article' %}TechArticle{% else %}WebApplication{% endif %}",
    "name": "DevLens",
    "description": "{% trans 'AI-powered developer diagnostics platform' %}",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "Any",
    "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
    }
}
</script>
