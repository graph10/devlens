{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-10">

    <div class="w-full max-w-lg">

        <div class="text-center mb-8">

            <h1 class="text-3xl font-bold tracking-tight text-foreground">
                {% translate "Change password" %}
            </h1>

            <p class="mt-3 text-base text-foreground-muted">
                {% translate "Choose a new secure password." %}
            </p>

        </div>

        <div class="rounded-2xl border border-border bg-background-card shadow-soft p-8">

            <form method="post" class="space-y-6">

                {% csrf_token %}

                {% for field in form %}

                <div>

                    <label
                        for="{{ field.id_for_label }}"
                        class="block text-sm font-medium text-foreground mb-2">

                        {{ field.label }}

                    </label>

                    {{ field }}

                    {% if field.errors %}
                    <p class="mt-2 text-xs text-severity-error">
                        {{ field.errors.0 }}
                    </p>
                    {% endif %}

                </div>

                {% endfor %}

                <button
                    type="submit"
                    class="w-full h-12 rounded-xl bg-accent text-white hover:bg-accent-hover transition">

                    {% translate "Update password" %}

                </button>

            </form>

        </div>

    </div>

</div>
{% endblock %}
